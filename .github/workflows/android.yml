name: Build Android APK

on:
  push:
    branches:
      - claude/android-mobile-video-browser-orNb0
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Report build failure
        if: failure()
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          if [ -f build.log ]; then
            grep -nE "error:|FAILURE:|What went wrong|Caused by|\.java:|FAILED|Unresolved" build.log | tail -n 80 > tail.txt
            if [ ! -s tail.txt ]; then tail -n 150 build.log > tail.txt; fi
          else
            echo "build.log not found — failure happened before gradle ran." > tail.txt
          fi
          jq -Rs '{body: ("🛠️ CI build failed. Key log:\n\n```\n" + . + "\n```")}' tail.txt > payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/1/comments" \
            -d @payload.json
          echo "comment posted"

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/VideoBrowser.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoBrowser-apk
          path: VideoBrowser.apk

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: 手机视频浏览器 APK（最新）
          body: |
            原生安卓短视频浏览器。
            下载下方 `VideoBrowser.apk` 直接安装即可（首次安装需允许“未知来源”）。
          files: VideoBrowser.apk
          fail_on_unmatched_files: true
